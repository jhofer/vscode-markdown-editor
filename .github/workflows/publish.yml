on:
  push:
    branches:
      - main
    tags:
      - "*"

name: Publish Extension
jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Publish to Visual Studio Marketplace
        uses: HaaLeo/publish-vscode-extension@v1.6.2
        with:
          pat: ${{ secrets.VS_MARKETPLACE_TOKEN }}
          registryUrl: https://marketplace.visualstudio.com
          # Everything ships bundled by esbuild and node_modules is in
          # .vscodeignore, so skip vsce's `npm list --production` check —
          # it fails on the React 19 peer ranges of outline-icons /
          # react-portal. Mirrors --no-dependencies in the npm scripts.
          dependencies: false
          # Publish to the stable channel.
          preRelease: false
          # Pushes to main that don't bump the version are a no-op instead
          # of a failed run.
          skipDuplicate: true
